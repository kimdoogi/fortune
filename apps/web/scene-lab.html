<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>장면 실험실</title>
    <!-- 개발용 페이지: 점집 내부·점술가 확인 (vite build 입력에 없다) -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Gowun+Dodum&display=swap"
    />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #141634; font-family: "Gowun Dodum", sans-serif; }
      canvas { display: block; width: 100%; height: 100%; }
      #panel { position: fixed; left: 6px; right: 6px; bottom: 6px; display: flex; flex-wrap: wrap; gap: 4px; z-index: 2; }
      #panel button, #panel select { font: inherit; font-size: 12px; padding: 5px 8px; border-radius: 8px; border: 1px solid #f2d38a; background: rgba(42,23,13,.85); color: #f6dc97; }
      #stats { position: fixed; top: 6px; left: 6px; z-index: 2; color: #fff; font: 11px/1.3 monospace; background: rgba(0,0,0,.5); padding: 4px 6px; border-radius: 6px; white-space: pre; }
      #ui { position: fixed; left: 0; right: 0; bottom: 0; height: 45%; background: linear-gradient(transparent, rgba(243,231,207,.55) 12%, rgba(243,231,207,.7)); border-top: 2px dashed rgba(255,255,255,.5); pointer-events: none; display: none; }
      body.ui #ui { display: block; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="ui"></div>
    <div id="stats"></div>
    <div id="panel"></div>
    <script type="module" src="/src/scene/lab.ts"></script>
  </body>
</html>
